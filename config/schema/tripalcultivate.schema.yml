# Tripal Cultivate Configuration/Settings Schema.

tripalcultivate.settings:
  type: config_object
  mapping:
    directory:
      type: mapping
      label: 'Directory structures for files generated by dependent modules'
      mapping:
        template_file:
          type: path
          label: 'Directory: data collection template file'
    ontology:
      type: mapping
      label: 'Settings related to traits'
      mapping:
        allownew:
          type: boolean
          label: 'Allow new traits during phenotypes import'