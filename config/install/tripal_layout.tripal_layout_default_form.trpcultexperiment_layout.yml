id: 'trpcultexperiment_layout'
label: 'Research Experiment'
description: 'Display for the research experiment content type.'
layouts:
  - tripal_entity_type: research_experiment
    field_groups:

## -- Vertical Tabs
      - id: stages
        type: vertical_tabs
        label: "Stages"
        children:
          - exp-tab-objectives
          - exp-tab-attribution
          - exp-tab-design
          - exp-tab-methods
          - exp-tab-references
          - exp-tab-outputs
      - id: exp-tab-objectives
        type: tab
        label: "Objectives"
        weight: 1
        show_empty: false
        open: true
        children:
          - exp-section-name
          - exp-section-why
          - exp-section-summary
      - id: exp-tab-attribution
        type: tab
        label: "Attribution"
        weight: 2
        show_empty: false
        open: false
        children:
          - exp_org
          # - exp_grant
          - exp_datacollector
          - exp_custodian
          - exp_curator
          - exp_citation
      - id: exp-tab-design
        type: tab
        label: "Design"
        weight: 3
        show_empty: false
        open: false
        children:
          # - exp_design currently multiple fields (e.g. exp_field_design)
          - exp_featureofinterest
          - exp_germgenus
          - exp_germspecies
          - exp_years
          - exp-section-units
      - id: exp-tab-methods
        type: tab
        label: "Methodology"
        weight: 5
        show_empty: false
        open: false
        children:
          - exp_pheno_method
          # - exp_protocols
          # - exp_analysis_method
      - id: exp-tab-references
        type: tab
        label: "References"
        weight: 5
        show_empty: false
        open: false
        children:
          - exp_pub ## Focus on support types
      - id: exp-tab-outputs
        type: tab
        label: "Research Outputs"
        weight: 5
        show_empty: false
        open: false
        children:
          - exp_datalicenses
          # - exp_pub ## Focus on result types
## -- Sections
      - id: exp-section-name
        label: "Name Guidelines"
        type: details
        open: true
        children:
          - field_instruct_exp_name
          - exp_name
      - id: exp-section-why
        label: "Why is this Experiment being done?"
        type: details
        open: true
        children:
          - field_instruct_exp_why
          - exp_objectives
          - exp_hypothesis
      - id: exp-section-summary
        label: "High Level Overview"
        type: details
        open: true
        children:
          - field_instruct_exp_overview
          - field_study
          - exp_description
      - id: exp-section-units
        type: details
        label: "Experimental Unit"
        weight: 5
        show_empty: false
        open: false
        children:
          - exp_germcollection
          - exp_field_locations
          - exp_field_design
          - exp_ghouse_locations
          - exp_ghouse_growingmedia
          - exp_ghouse_design
          - exp_gchamber_locations
          - exp_gchamber_growingmedia
          - exp_gchamber_design
          - exp_bchem_technique
          - exp_bchem_assayprotocal
          - exp_bchem_labfacility
          - exp_bchem_date
          - expdesign_field
          - expdesign_ghouse
          - expdesign_gchamber
          - expdesign_bchem
## -- Advanced Sidebar
      - id: author
        type: details_sidebar
        label: "Authoring Information"
        children:
          - uid
          - created
          - exp_dbxref
      - id: url_paths
        type: details_sidebar
        label: "URL Paths"
        children:
          - path
      - id: meta
        type: details_sidebar
        label: "Status"
        weight: -10
        children:
          - experiment_type
