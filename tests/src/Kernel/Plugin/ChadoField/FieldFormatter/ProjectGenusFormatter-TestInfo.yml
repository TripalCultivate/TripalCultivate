system-under-test:
  chado_version: '1.3.3.013'
  bundle:
    label: 'Research Experiment'
    termIdSpace: 'SIO'
    termAccession: '000994'
    id: 'research_experiment'
    settings:
      chado_base_table: 'project'
      bundle_type_table: 'project'
      bundle_type_column: 'type_id'
  fields:
  - name: 'exp_name'
    type: 'chado_string_type_default'
    type_class: 'Drupal\tripal_chado\Plugin\Field\FieldType\ChadoStringTypeDefault'
    widget: 'chado_string_type_widget'
    formatter: 'chado_string_type_formatter'
    termIdSpace: 'schema'
    termAccession: 'name'
    cardinality: 1
    settings:
      storage_plugin_id: 'chado_storage'
      storage_plugin_settings:
          base_table: 'project'
          base_column: 'name'
  - name: 'exp_organism'
    type: 'project_genus'
    type_class: 'Drupal\trpcultivate\Plugin\Field\FieldType\ProjectGenusTypeItem'
    cardinality: -1
    widget: 'project_genus_widget'
    formatter: 'project_genus_formatter'
    termIdSpace: 'TAXRANK'
    termAccession: '0000005'
    settings:
      sciname_term: 'scientific name (NCBITaxon:scientific_name)'
      genus_term: 'genus (TAXRANK:0000005)'
      termIdSpace: 'TAXRANK'
      termAccession: '0000005'
      debug: false
      storage_plugin_settings:
        prop_table: 'projectprop'
        base_table: 'project'
      storage_plugin_id: 'chado_storage'
scenarios:
  - label: 'Single organism'
    description: 'Creates a page with a single organism for the field under test.'
    user_input:
      exp_name:
      - record_id: 1
        value: 'Test Experiment'
      exp_organism:
      - record_id: 1
        organism_id: 1
        genus_prop_id: 0
        genus_prop_fkey: 0
        genus_type_id: 25
        field_name: 'exp_organism'
        genus_rank: 0
        sciname_prop_id: 0
        sciname_prop_fkey: 0
        sciname_type_id: 20
        sciname_rank: 0
        genus_value: 'Lens'
        sciname_value: 'Lens culinaris'
    is_empty: false
    expected_genus:
      count: 1
      values:
        - 'Lens'
    expected_sciname:
      count: 1
      values:
      - 'Lens culinaris'
  - label: 'Three organisms, two share genus'
    description: 'Creates a page with a three organism where two have the same genus.'
    user_input:
      exp_name:
      - record_id: 1
        value: 'Test Experiment'
      exp_organism:
      - record_id: 1
        organism_id: 1
        genus_prop_id: 0
        genus_prop_fkey: 0
        genus_type_id: 25
        field_name: 'exp_organism'
        genus_rank: 0
        sciname_prop_id: 0
        sciname_prop_fkey: 0
        sciname_type_id: 20
        sciname_rank: 0
        genus_value: 'Lens'
        sciname_value: 'Lens culinaris'
      - record_id: 1
        organism_id: 1
        genus_prop_id: 0
        genus_prop_fkey: 0
        genus_type_id: 25
        field_name: 'exp_organism'
        genus_rank: 0
        sciname_prop_id: 0
        sciname_prop_fkey: 0
        sciname_type_id: 20
        sciname_rank: 0
        genus_value: 'Lens'
        sciname_value: 'Lens ervoides'
      - record_id: 1
        organism_id: 1
        genus_prop_id: 0
        genus_prop_fkey: 0
        genus_type_id: 25
        field_name: 'exp_organism'
        genus_rank: 0
        sciname_prop_id: 0
        sciname_prop_fkey: 0
        sciname_type_id: 20
        sciname_rank: 0
        genus_value: 'Tripalus'
        sciname_value: 'Tripalus databasica'
    is_empty: false
    expected_genus:
      count: 3
      values:
        - 'Lens'
        - 'Lens'
        - 'Tripalus'
    expected_sciname:
      count: 3
      values:
      - 'Lens culinaris'
      - 'Lens ervoides'
      - 'Tripalus databasica'
  - label: 'No organisms'
    description: 'Creates a page where the field under test is empty.'
    user_input:
      exp_name:
      - record_id: 1
        value: 'Test Experiment'
      exp_organism:
      - record_id: 1
        organism_id: 0
        genus_prop_id: 0
        genus_prop_fkey: 0
        genus_type_id: 25
        field_name: 'exp_organism'
        genus_rank: 0
        sciname_prop_id: 0
        sciname_prop_fkey: 0
        sciname_type_id: 20
        sciname_rank: 0
        genus_value: ''
        sciname_value: ''
    is_empty: true
    expected_genus:
      count: 0
      values: {}
    expected_sciname:
      count: 0
      values: {}
