# TripalCultivate Services.

services:
  trpcultivate.template_generator:
    class: 'Drupal\trpcultivate\Service\TripalCultivateFileTemplateService'
    arguments: ['@config.factory', '@current_user']

  trpcultivate.import_validation_helper:
    class: 'Drupal\trpcultivate\Service\TripalCultivateImportValidationHelper'

  plugin.manager.trpcultivate_validator:
    class: 'Drupal\trpcultivate\TripalCultivateValidator\TripalCultivateValidatorManager'
    parent: default_plugin_manager
    arguments: ['@tripal_chado.database']
