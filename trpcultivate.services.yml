# TripalCultivate Services.

services:
  trpcultivate.template_generator:
    class: 'Drupal\trpcultivate\Service\TripalCultivateFileTemplateService'
    arguments: ['@config.factory', '@current_user']

  trpcultivate.import_validation_helper:
    class: 'Drupal\trpcultivate\Service\ImportValidationHelper'

  plugin.manager.trpcultivate_validator:
    class: 'Drupal\trpcultivate\TripalCultivateValidator\TripalCultivateValidatorManager'
    parent: default_plugin_manager
    arguments: ['@tripal_chado.database']

  Drupal\tripal\Services\TripalLogger:
    alias: 'tripal.logger'

  trpcultivate.hooks:
    class: 'Drupal\trpcultivate\Hook\TripalCultivateHooks'
    arguments:
      - '@tripal.logger'

  trpcultivate.theme_hooks:
    class: 'Drupal\trpcultivate\Hook\TripalCultivateThemeHooks'
    arguments: ['@current_route_match']

  trpcultivate.setup_module_service:
    class: 'Drupal\trpcultivate\Service\SetupModuleService'
    arguments: [
      '@entity_type.manager',
      '@tripal_chado.terms_init',
      '@tripal.tripalentitytype_collection',
      '@tripal.tripalfield_collection',
      '@file_system',
      '@extension.list.module',
    ]
