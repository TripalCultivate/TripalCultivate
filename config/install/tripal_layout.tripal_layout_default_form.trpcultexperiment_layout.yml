id: 'trpcultexperiment_layout'
label: 'Research Experiment'
description: 'Display for the research experiment content type.'
layouts:
  - tripal_entity_type: "research_experiment"
    field_groups:
      - id: stages
        type: vertical_tabs
        label: "Stages"
        children:
          - experiment_objectives
          - experiment_funding
          - experiment_design
          - experiment_units
          - experiment_methods
          - experiment_people
          - experiment_outputs
      - id: experiment_objectives
        type: tab
        label: "Objectives"
        description: "The following information applies to your experiment as a whole. Think about why you are doing the experiment, and describe the experiment like you would to a graduate degree committee or when applying for a grant."
        weight: 1
        show_empty: false
        open: true
        children:
          - "exp_name"
          # - "exp_question"
          - "exp_objectives"
          # - "exp_hypothesis"
          # - "exp_study"
          - "exp_description"
      - id: experiment_funding
        type: tab
        label: "Funding"
        description: "These fields ensure that all funding organizations behind this research receive credit for funding this work. You may need to talk your PI for these details."
        weight: 2
        show_empty: false
        open: false
        children:
          - "exp_org"
          # - "exp_grant"
      - id: experiment_design
        type: tab
        label: "Design"
        description: ""
        weight: 3
        show_empty: false
        open: false
        children:
          # - "exp_design" currently multiple fields (e.g. exp_field_design)
          - "exp_featureofinterest"
          - "exp_germgenus"
          - "exp_germspecies"
          - "exp_years"
      - id: experiment_methods
        type: tab
        label: "Methodology"
        description: "Often in agriculture we are measuring or observing traits in the germplasm we are studying. This can include more typical phenotypic traits such as the plant height or days from sowing to flowering, and also more derived traits such as protein content, microbiome species composition, or measurements derived from high throughput phenotyping platforms (e.g. drone, BELT)."
        weight: 5
        show_empty: false
        open: true
        children:
          - "exp_pheno_method"
